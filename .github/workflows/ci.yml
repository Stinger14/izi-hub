name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a new push cancels run on-going

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/core
    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4.1"

      - uses: actions/cache@v4
        with:
          path: |
            backend/core/deps
            backend/core/_build
          key: ${{ runner.os }}-mix-test-1.18.4-27.3.4.1-${{ hashFiles('backenc/core/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-1.18.4-27.3.4.1-

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  polo_studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart_services/polo_studio

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: smart_services/polo_studio/uv.lock

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
