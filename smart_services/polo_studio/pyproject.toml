[project]
name = "polo-studio"
version = "0.1.0"
description = "AI writing and media helpers for IziHub's creator studio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
